<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./lista.css">
    <title>Lista de Gatinhos</title>
</head>
<body>

    <main class="list">
        <header class="title">
            <h1>Meus Gatinhos Fofinhos</h1>
            <p>Adicione, edite e remova seus gatinhos fofinhos</p>
        </header>

        <section class="list-add" aria-label="Adicionar gatinho">
            <input type="text" id="catName" placeholder="Digite o nome do gatinho...">
            <button id="inicio" type="button">Adicionar no início</button>
            <button id="final" type="button">Adicionar no final</button>
        </section>

        <p id="erro"></p>

        <section id="catList" aria-label="Lista de gatinhos"></section>
    </main>

    <script src="./script.js"></script>
</body>
</html>
